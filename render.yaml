services:
  - type: web
    name: carolina5-web
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: carolina5-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_COOKIE
        value: carolina_session
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: RUN_INITIAL_SEED
        value: "false"
      - key: RUN_MIGRATIONS
        value: "true"
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TEST_STAFF_NAME
        sync: false
      - key: TEST_STAFF_EMAIL
        sync: false
      - key: TEST_STAFF_PASSWORD
        sync: false
      - key: TEST_STAFF_ROLE
        sync: false
      - key: TEST_HOUSEKEEPING_EMAIL
        sync: false
      - key: TEST_HOUSEKEEPING_PASSWORD
        sync: false
      - key: TEST_VIEWER_EMAIL
        sync: false
      - key: TEST_VIEWER_PASSWORD
        sync: false
      - key: MAIL_MAILER
        value: log

databases:
  - name: carolina5-db
    plan: free
    databaseName: carolina5
    user: carolina5
